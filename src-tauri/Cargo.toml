[package]
name = "sinth-ide"
version = "0.0.1"
description = "Professional desktop IDE for the Sinth language."
authors = ["Yannosay Productions"]
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Yannosay/sinth-ide"
default-run = "sinth-ide"

[lib]
name = "sinth_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
portable-pty = "0.8"
encoding_rs = "0.8"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
